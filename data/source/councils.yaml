# Master council registry — one entry per principal council.
#
# Drives:
#   scripts/00_fetch_prior_winners.py    via wiki_prior + wiki_prior_year
#   scripts/00b_fetch_2026_results.py    via wiki_2026                      [added in Phase B]
#   scripts/_councils.py                 region resolution via region_gm    [+ future region flags]
#
# Schema (every field required, use null where no value applies):
#   lad_code         ONS LAD24 code (e.g. E08000001 for met. boroughs)
#   name             human-readable council name
#   nation           england | wales | scotland
#   cycle            thirds | halves | all-out
#   region_gm        true for the 10 Greater Manchester boroughs; false otherwise
#   wiki_2026        Wikipedia article title for the 2026 election, or null
#                    (null if no 2026 contest, or if results live in
#                    data/source/results_2026.csv as hand-curated)
#   wiki_prior       Wikipedia article title for the most-recent prior
#                    contest of the same seats (4 years back for thirds &
#                    all-out, 2 years back for halves)
#   wiki_prior_year  integer year of wiki_prior
#
# Seeded with the 10 GM councils only. Phase B.6 extends this to ~390 GB
# principal councils.

- lad_code: E08000001
  name: Bolton
  nation: england
  cycle: thirds
  region_gm: true
  wiki_2026: null
  wiki_prior: "2022 Bolton Metropolitan Borough Council election"
  wiki_prior_year: 2022

