# Master council registry — one entry per principal council.
#
# Drives:
#   scripts/00_fetch_prior_winners.py    via wiki_prior + wiki_prior_year
#   scripts/00b_fetch_2026_results.py    via wiki_2026                      [added in Phase B]
#   scripts/10_fetch_current_winners.py  via wiki_current_articles          [Current map page]
#   scripts/12_fetch_official_results.py via official_url + official_parser [official-source pipeline, issue #9]
#   scripts/13_extract_official.py       via official_parser + official_year
#   scripts/_councils.py                 region resolution via region_gm    [+ future region flags]
#
# Schema (every field required, use null where no value applies):
#   lad_code         ONS LAD24 code (e.g. E08000001 for met. boroughs)
#   name             human-readable council name
#   nation           england | wales | scotland
#   cycle            thirds | halves | all-out
#   region_gm        true for the 10 Greater Manchester boroughs; false otherwise
#   wiki_2026        Wikipedia article title for the 2026 election, or null
#                    (null if no 2026 contest, or if results live in
#                    data/source/results_2026.csv as hand-curated)
#   wiki_prior       Wikipedia article title for the most-recent prior
#                    contest of the same seats (4 years back for thirds &
#                    all-out, 2 years back for halves)
#   wiki_prior_year  integer year of wiki_prior
#   electoral_system fptp | stv. England + Wales = fptp; Scotland = stv.
#                    Drives the parser dispatch in scripts/11_extract_current.py.
#   wiki_current_articles
#                    null, or a list [{year: int, title: str}, ...] in
#                    newest-first order. For councils that contested 2026
#                    this is null — their "current" winner is already in
#                    data/all_wards.json. For non-2026 councils this lists
#                    every Wikipedia article needed to cover every ward's
#                    most-recent contest (typically 1 entry for all-out
#                    councils; 2-3 entries for thirds councils covering the
#                    years between their last all-out and now).
#
# Optional fields for the official-source pipeline (issue #9). All null by
# default; set together once a council's own results page is plumbed in:
#   official_url     URL of the council's results page (or list of URLs).
#                    Plain text-table .aspx, ArcGIS dashboard JSON,
#                    Power BI embed, per-division HTML, PDF — the parser
#                    module decides what to do with the fetched bytes.
#   official_parser  key into scripts/_official_parsers/<key>.py. E.g.
#                    "norfolk_textresults", "arcgis_dashboard",
#                    "powerbi_dashboard", "per_division_html".
#   official_year    integer year these results cover. Drives the output
#                    CSV: data/source/{county,ward}_official_<year>.csv.
# When set, the official source overrides Wikipedia in scripts/04c at the
# join step (per-record precedence: official > 2026 wiki > current_scrape).
#
# Coverage today (139 councils):
#   - 10 GM councils (E08000001-E08000010, region_gm: true)
#   - 26 non-GM English metropolitan boroughs (E08000011-E08000037)
#   - 33 London boroughs (E09000001-E09000033; City of London has wiki_*: null)
#   - 16 English unitary authorities (E06*) — every one that contested May 2026
#   - 48 English non-metropolitan districts (E07*) — every one that contested May 2026
#   - 6 English county councils (E10*) — every one that contested May 2026
# Together this covers 134 of the 136 council elections held on 7 May 2026.
# The two missing ones are East Surrey and West Surrey — newly created merger
# councils that don't yet appear in the ONS WD24_LAD24 lookup and have no
# Census 2021 boundary; defer them until ONS publishes the new boundary set.
#
# Not yet added (~180 councils with no 2026 contest):
#   - Other English unitaries / districts on non-2026 election years
#   - Welsh principal areas (W06*; no 2026 elections, useful for Map only)
#   - Scottish council areas (S12*; multi-member STV needs a separate parser)
# Phase B.6 of plans/plan-a-refactor-to-moonlit-pie.md tracks the expansion.

- lad_code: E08000001
  name: Bolton
  nation: england
  cycle: thirds
  region_gm: true
  wiki_2026: null
  wiki_prior: "2022 Bolton Metropolitan Borough Council election"
  wiki_prior_year: 2022
  electoral_system: fptp
  wiki_current_articles: null
  official_url: "https://www.bolton.gov.uk/news/article/2037/local-election-results-2026"
  official_parser: bolton
  official_year: 2026

